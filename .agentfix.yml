# Overrides for the AI Issue Fixer agent.

# `npm test` covers apps/api/test/ only. Those files import nothing outside the
# Node standard library - validation.js is pure, and db.js builds on node:sqlite
# - so the suite runs in the agent's scratch clone, where dependencies are
# never installed. apps/api/test-http/ needs express and is excluded for that
# reason; run it locally with `npm run test:http`.
# Two deliberate choices in this command:
#
#   --test-reporter=dot   The default spec reporter prints a line per test, so
#                         130 passing tests cost ~8,500 characters (~2,100
#                         tokens) and that lands in the agent's transcript on
#                         every run. Dot prints one character per test: 144
#                         characters green, and it still names failing tests,
#                         which is all the baseline comparison and the
#                         fail-to-pass check actually read.
#
#   raw `node --test`     Not `npm test`. nameFilterFlag() in repo/tests.ts
#                         matches /node\s+--test/ to pick
#                         --test-name-pattern; behind an npm script it falls
#                         back to `-t`, which npm does not understand, and
#                         single-test flake discrimination breaks.
tests:
  command: node --test --test-reporter=dot --disable-warning=ExperimentalWarning "apps/api/test/**/*.test.js"
  directory: apps/api/test

# The real root build is `tsc --noEmit && vite build`, which needs node_modules.
# The agent is forbidden from running package installs, so that build can never
# succeed in its workspace, and a non-zero build exit is a hard failure in the
# validation gate. Point it at a no-op so the gate judges the diff on its merits.
build:
  command: node --version
